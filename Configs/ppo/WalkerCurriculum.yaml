behaviors:
  Walker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 500000
    keep_checkpoints: 80
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true

environment_parameters:
  curriculum_value:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: reward
          behavior: Walker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 400
        value: 0.8
      - name: Lesson1
        completion_criteria:
          measure: reward
          behavior: Walker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 400
        value: 0.6
      - name: Lesson2
        completion_criteria:
          measure: reward
          behavior: Walker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 400
        value: 0.4
      - name: Lesson3
        completion_criteria:
          measure: reward
          behavior: Walker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 400
        value: 0.2
      - name: Lesson4
        value: 0
